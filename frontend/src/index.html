<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="THE GANG — chat privado do time" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <title>THE GANG</title>
    <script>
      (function () {
        var colors = {
          gold: "#f0b232",
          orange: "#e67e22",
          ember: "#f26522",
          blue: "#5865f2",
          purple: "#7c3aed",
          pink: "#e879f9",
          red: "#f23f43",
          green: "#23a559",
          cyan: "#22d3ee",
        };
        try {
          var id = localStorage.getItem("tg_accent") || "gold";
          var hex = colors[id] || colors.gold;
          var n = parseInt(hex.slice(1), 16);
          var root = document.documentElement;
          root.style.setProperty("--accent", hex);
          root.style.setProperty("--accent-2", hex);
          root.style.setProperty(
            "--accent-soft",
            "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + ",0.16)"
          );
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
