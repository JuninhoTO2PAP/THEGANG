[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"alembic/versions/*" = ["I001", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
