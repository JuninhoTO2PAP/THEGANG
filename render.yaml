# Blueprint Render — API THE GANG 24/7
# Dashboard: New → Blueprint → conectar este repo (ou pasta via GitHub)

databases:
  - name: the-gang-db
    plan: free
    databaseName: thegang
    user: thegang

services:
  - type: web
    name: the-gang-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SEED_ON_BOOT
        value: "1"
      - key: CORS_ORIGINS
        value: https://gang.httpslaudo.com.br,https://the-gang.pages.dev
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: VAPID_CONTACT
        value: mailto:admin@httpslaudo.com.br
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: the-gang-db
          property: connectionString
      - key: LIVEKIT_URL
        value: wss://the-gang-project-ifijvidj.livekit.cloud
      - key: LIVEKIT_API_KEY
        value: APIHqq8vYgdewdA
      - key: LIVEKIT_API_SECRET
        value: ok0D8xNQNnq0fiIlL1CUdinVRvn1z4CWPTyISZNogqE
